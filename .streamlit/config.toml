[ui]
hideTopBar = true

[theme]
base = "dark"
primaryColor = "#60a5fa"
backgroundColor = "#0c1220"
secondaryBackgroundColor = "#0f172a"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
